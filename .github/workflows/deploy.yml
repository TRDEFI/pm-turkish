name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Debug private key length
        run: |
          echo "Private key length: ${#PRIVATE_KEY}"
          echo "First 4 chars: ${PRIVATE_KEY:0:4}"
          echo "Last 4 chars: ${PRIVATE_KEY: -4}"

      - name: Deploy to Polygon Amoy
        env:
          POLYGON_RPC_URL: ${{ secrets.PMTURKISH }}
          PRIVATE_KEY: ${{ secrets.PMTURKISH01 }}
        run: npx hardhat run scripts/deploy.js --network polygonAmoy

      - name: Verify on Polygonscan
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.PMTURKISH02 }}
        run: |
          echo "Contract verification requires deployed addresses"
          echo "Add verification step after deployment output is parsed"
