name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Debug secrets
        env:
          RPC_LEN: ${{ secrets.PMTURKISH }}
          PK_LEN: ${{ secrets.PMTURKISH01 }}
          API_LEN: ${{ secrets.PMTURKISH02 }}
        run: |
          echo "RPC_URL length: ${#RPC_LEN}"
          echo "PRIVATE_KEY length: ${#PK_LEN}"
          echo "API_KEY length: ${#API_LEN}"
          echo "RPC_URL starts with: ${RPC_LEN:0:8}"

      - name: Deploy to Polygon Amoy
        env:
          POLYGON_RPC_URL: ${{ secrets.PMTURKISH }}
          PRIVATE_KEY: ${{ secrets.PMTURKISH01 }}
        run: npx hardhat run scripts/deploy.js --network polygonAmoy

      - name: Verify on Polygonscan
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.PMTURKISH02 }}
        run: |
          echo "Contract verification requires deployed addresses"
          echo "Add verification step after deployment output is parsed"
