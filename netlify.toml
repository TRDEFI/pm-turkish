[build]
  command = "next build"
  publish = "out"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Crypto 5-minute events (every 5 min) ────────────────────────────────
# Generates: kripto-5dk events from real Gate.io klines
[functions.generate-events]
  schedule = "*/5 * * * *"

# ── Daily events: weather + crypto-daily + FX (once per day at midnight UTC) ──
# Generates: hava, kripto-gun, doviz events with OpenRouter AI
[functions.generate-daily]
  schedule = "0 0 * * *"
